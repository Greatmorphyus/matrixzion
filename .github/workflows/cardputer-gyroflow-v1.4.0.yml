name: Build Cardputer Gyroflow v1.4.0

on:
  push:
    branches:
      - codex/cardputer-gyroflow-v1.4.0
    paths:
      - cardputer-gyroflow-v1.4.0/**
      - .github/workflows/cardputer-gyroflow-v1.4.0.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -d cardputer-gyroflow-v1.4.0

      - name: Package deliverables
        run: |
          mkdir -p dist
          cp cardputer-gyroflow-v1.4.0/.pio/build/m5stack-stamps3/firmware.bin dist/Cardputer_ADV_Gyroflow_v1.4.0.bin
          git archive --format=zip --prefix=Cardputer_ADV_Gyroflow_v1.4.0/ -o dist/Cardputer_ADV_Gyroflow_v1.4.0_Source.zip HEAD:cardputer-gyroflow-v1.4.0
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Cardputer-ADV-Gyroflow-v1.4.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30
